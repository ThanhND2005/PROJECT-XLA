services:
  texture-lab:
    build: .
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${GLCM_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3))['fijiConfigured']"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
